name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-groups

      - name: Lockfile is consistent with pyproject.toml
        run: uv lock --check

      - name: Formatting (ruff format --check)
        run: uv run ruff format --check .

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Type checking (mypy --strict)
        run: uv run mypy

      - name: Type checking (pyright)
        run: uv run pyright

      - name: Unit tests
        run: uv run pytest --cov=dpcompat --cov-report=term-missing

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: warn

      - name: CLI smoke (versions + inspect)
        run: make smoke

      - name: Plan a multi-target migration
        run: uv run dpcompat plan examples/simple_pack --target 1.21.4 --target 26.2

      - name: Build archives and validate the universal ZIP
        run: |
          uv run dpcompat build examples/simple_pack --target 1.21.4 --target 1.21.9 --target 26.2 --output dist
          python -m zipfile -t dist/datapack-universal-1.21.4-plus.zip

      - name: Package the distribution
        run: uv build

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Quality gates via the PowerShell dev script
        shell: pwsh
        run: .\scripts\build.ps1 check
      - name: CLI smoke via the PowerShell dev script
        shell: pwsh
        run: .\scripts\build.ps1 smoke
