[build]
targets = ["1.21.4", "1.21.5", "1.21.6", "1.21.8", "1.21.9", "1.21.11", "26.1", "26.2"]
universal = true
output_name = "my-pack"
clean_output = true
# pack_root = "bundle/datapack" # Select a data pack inside a bundled ZIP.
# source_format = "61" # Only set after manually reviewing a misleading pack.mcmeta.

[policy]
allow_emulated = true
allow_lossy = false
allow_unknown = false
fail_on_warnings = false

# Extension rules are additive: built-ins stay enabled. Python modules expose RULES or
# dpcompat_rules(); installed packages may register the "dpcompat.rules" entry-point group.
# Declarative JSON files support only schema-validated, path-scoped exact transforms.
[rules]
modules = []
files = []
load_entry_points = true

# Optional reviewed implementations merged after automatic migration.
# Paths are relative to this TOML file. A fallback folder may contain data/, pack.png,
# or any other pack-root paths. Add .dpcompat-fallback.toml for exact deletions and
# reviewed diagnostic resolutions. pack.mcmeta is always regenerated by DPCompat.
[fallbacks]
# "1.21.4" = "compat/1.21.4"
# "94.1" = "compat/format-94.1"
